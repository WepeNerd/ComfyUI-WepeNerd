name: CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          repository: Comfy-Org/ComfyUI
          ref: v0.34.0
          path: host-comfyui
      - run: python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r host-comfyui/requirements.txt
      - run: python -B -m unittest discover -s tests -t . -p 'test_*.py'
        env:
          PYTHONPATH: host-comfyui
      - run: python -B tests/check_packages.py .
        env:
          PYTHONPATH: host-comfyui
      - name: Frontend syntax
        run: |
          if [ -d js ]; then find js -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -r -n1 node --check; fi
      - run: node --test tests/test_liquify_warp.mjs
      - run: git diff --check
